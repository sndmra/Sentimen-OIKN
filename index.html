<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKN Sentiment Analysis Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { primary: "#c7a74a" },
      fontFamily: { sans: ["Inter", "sans-serif"] },
    },
  },
};
</script>

<style>
body {
  background: radial-gradient(circle at center, #fdfdfb 0%, #f6f5f1 100%);
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #333;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

/* Spinner gaya Windows startup (versi terang) */
.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid rgba(0,0,0,0.1);
  border-top: 4px solid #c7a74a;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-bottom: 20px;
}
@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Fade-in hanya untuk teks */
.fade-in {
  opacity: 0;
  transform: translateY(8px);
  animation: fadeInUp 1.2s ease forwards;
  animation-delay: 0.3s;
  animation-fill-mode: both;
  will-change: opacity, transform;
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Logo efek lembut */
.logo-glow {
  filter: drop-shadow(0 0 6px rgba(199,167,74,0.35));
  transition: transform 0.6s ease, filter 0.6s ease;
}
.logo-glow:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 0 10px rgba(199,167,74,0.6));
}
</style>
</head>

<body>
  <!-- Logo -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Logo_of_Ibu_Kota_Nusantara.svg"
       alt="Logo IKN" width="110" class="mb-6 logo-glow">

  <!-- Judul -->
  <h1 class="text-3xl sm:text-4xl font-extrabold text-primary mb-2 tracking-tight text-center">
    Dashboard Analisis Persepsi Masyarakat
  </h1>
  <p class="text-gray-600 text-sm sm:text-base text-center mb-6">
    Otorita Ibu Kota Nusantara · Direktorat Data dan Kecerdasan Buatan
  </p>

  <!-- Spinner (langsung muncul) -->
  <div class="spinner"></div>

  <!-- Teks fade-in -->
  <p class="text-gray-500 text-sm mt-3 fade-in">Memuat dashboard...</p>

  <!-- Footer -->
  <footer class="absolute bottom-5 text-xs text-gray-500 fade-in">
    © 2025 Sean Daffa Damara – Direktorat Data dan Kecerdasan Buatan
  </footer>

  <!-- Redirect otomatis -->
  <script>
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 2500);
  </script>
</body>
</html>
